# starter compose for the recommended engine (vLLM example)
# Generated by: servefit fit --model Qwen3-8B --from examples/profile-rtx4090.json
# Adjust --max-model-len and GPU reservations to your box.
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen3-8B
      --max-model-len 32768
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # servefit note: this gets you a single OpenAI-compatible endpoint.
    # Production still needs: load balancing, autoscaling, monitoring.
